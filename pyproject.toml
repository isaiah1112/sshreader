[project]
authors = [
    {name = "Jesse Almanrode", email = "jesse@almanrode.com"},
]
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.11,<4.0"
dependencies = [
    "click>=8.4.2",
    "colorama>=0.4.6",
    "paramiko>=5.0.0",
    "progressbar2>=4.5.0",
    "python-hostlist>=2.3.0",
]
name = "sshreader"
version = "7.0.0"
description = "Multi-threading/processing wrapper for Paramiko"
readme = "README.md"
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.pdm.build]
includes = ["sshreader", "sshreader/scripts"]
excludes = ["**/.DS_Store"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.urls]
homepage = "https://sshreader.readthedocs.io/"
repository = "https://github.com/isaiah1112/sshreader"

[project.scripts]
pydsh = "sshreader.scripts.pydsh:cli"

[dependency-groups]
test = [
    "coverage>=7.15.2",
    "discover>=0.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]
docs = [
    "sphinx>=7,<10",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "B", "SIM", "I"]
ignore = ["E501", "F401"]

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
