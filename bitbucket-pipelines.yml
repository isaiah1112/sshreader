image: python:latest

pipelines:
  default:
    - step: &latest
        name: Python3.9
        image: python:3.9
        script:
          - pip install -U tox
          - tox -e py39
        services:
          - sshd
        caches:
          - pip
  branches:
    master:
    - step:
        name: Python3.5
        image: python:3.5
        script:
          - pip install -U tox
          - tox -e py35
        services:
          - sshd
        caches:
          - pip
    - step:
        name: Python3.6
        image: python:3.6
        script:
          - pip install -U tox
          - tox -e py36
        services:
          - sshd
        caches:
          - pip
    - step:
        name: Python3.7
        image: python:3.7
        script:
          - pip install -U tox
          - tox -e py37
        services:
          - sshd
        caches:
          - pip
    - step:
        name: Python3.8
        image: python:3.8
        script:
          - pip install -U tox
          - tox -e py38
        services:
          - sshd
        caches:
          - pip
    - step: *latest
    - step:
        name: Documentation Build
        script:
          - pip install -U tox
          - tox -e docs
    - step:
        name: Deploy To PyPi
        script:
          - pip install twine
          - bash -e deploy.bash
definitions:
  services:
    sshd:
      image: isaiah1112/sshreader:latest
