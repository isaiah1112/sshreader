image: python:latest

pipelines:
  default:
    - step: &py37
        name: Python3.7
        image: python:3.7
        script:
          - pip install -U tox
          - tox -e py37
        services:
          - sshd
        caches:
          - pip
    - step: &py38
        name: Python3.8
        image: python:3.8
        script:
          - pip install -U tox
          - tox -e py38
        services:
          - sshd
        caches:
          - pip
    - step: &py39
        name: Python3.9
        image: python:3.9
        script:
          - pip install -U tox
          - tox -e py39
        services:
          - sshd
        caches:
          - pip
    - step: &py310
        name: Python3.10
        image: python:3.10
        script:
          - pip install -U tox
          - tox -e py310
        services:
          - sshd
        caches:
          - pip
  branches:
    master:
      - step: *py37
      - step: *py38
      - step: *py39
      - step: *py310
      - step:
          name: Documentation Build
          script:
            - pip install -U tox
            - tox -e docs
      - step:
          name: Deploy To PyPi
          script:
            - pip install twine
            - bash -e deploy.bash
definitions:
  services:
    sshd:
      image: isaiah1112/sshreader:latest
