name: Docs Requirements Sync

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: ["develop"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "docs/requirements.txt"
      - ".github/workflows/docs_requirements.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "docs/requirements.txt"
      - ".github/workflows/docs_requirements.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export docs requirements
        run: uv export --group docs --no-hashes --output-file docs/requirements.txt

      - name: Create pull request for docs requirements updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-docs-requirements
          base: develop
          title: "chore(docs): refresh generated RTD requirements"
          commit-message: "chore(docs): refresh generated RTD requirements"
          body: |
            This PR updates the generated Sphinx requirements file used by Read the Docs.

            Generated from the `docs` dependency group via:
            `uv export --group docs --no-hashes --output-file docs/requirements.txt`
          add-paths: |
            docs/requirements.txt
          delete-branch: true
          labels: |
            dependencies
            docs
